service: shui-api
frameworkVersion: '4'
useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-north-1
  stage: dev
  profile: pinar

  environment:
    USERS_TABLE: ${self:service}-${sls:stage}-users
    POSTS_TABLE: ${self:service}-${sls:stage}-posts
    COMMENTS_TABLE: ${self:service}-${sls:stage}-comments
    JWT_SECRET: ${env:JWT_SECRET}
  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - !GetAtt UsersTable.Arn
            - !GetAtt PostsTable.Arn
            - !GetAtt CommentsTable.Arn  

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S
        KeySchema:
          - AttributeName: username
            KeyType: HASH

    PostsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.POSTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.COMMENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: postId
            AttributeType: S
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: postId
            KeyType: HASH
          - AttributeName: id
            KeyType: RANGE
functions:
  register:
    handler: src/handlers/auth/register.handler
    events:
      - httpApi:
          path: /auth/register
          method: post

  login:
    handler: src/handlers/auth/login.handler
    events:
      - httpApi:
          path: /auth/login
          method: post